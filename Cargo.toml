[package]
name = "moonkale-ext-lux"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Julia block libraries (Lux.jl, ModelingToolkit, RxInfer) for Moonkale's flow editor, with Julia codegen. An opt-in Moonkale extension (Milestone 6); its own repository since Milestone 18 phase 6.4."
repository = "https://github.com/MathStruct/moonkale-julia"

[dependencies]
dioxus = "0.7.10"
# Moonkale's extension contract, by git tag (never a branch): `ext-api-YYYY-MM-DD` marks
# a compatible state of moonkale-core / moonkale-ext-api / moonkale-graph-render.
moonkale-ext-api = { git = "https://github.com/MathStruct/Moonkale", tag = "ext-api-2026-10-14" }

